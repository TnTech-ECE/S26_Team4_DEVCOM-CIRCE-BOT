#     max_particles: 2000
#     min_particles: 500
#     odom_frame_id: odom
#     pf_err: 0.05
#     pf_z: 0.99
#     qos_overrides:
#       /tf:
#         publisher:
#           depth: 100
#           durability: volatile
#           history: keep_last
#           reliability: reliable
#     recovery_alpha_fast: 0.0
#     recovery_alpha_slow: 0.0
#     resample_interval: 1
#     robot_model_type: nav2_amcl::DifferentialMotionModel
#     save_pose_rate: 0.2
#     scan_topic: scan
#     set_initial_pose: false
#     sigma_hit: 0.1
#     tf_broadcast: false
#     transform_tolerance: 1.2
#     update_min_a: 0.2
#     update_min_d: 0.25
