# Intel RealSense D456 -- driver: realsense2_camera / realsense2_camera_node
#
# Split out of roverrobotics_driver/config/accessories.yaml. The upstream `active:`
# flag is gone: use the `use_camera` launch argument on
# circe_bringup/launch/sensors.launch.py instead.
#
# The D456 is the IP65 / M12-connector variant of the D455: same optics, same 95 mm
# baseline, same IMU, same 400-series SDK. It enumerates as a D455 and is modelled by
# realsense2_description's sensor_d455 macro.
#
# Top-level key is the `/**` wildcard deliberately -- the node runs as /camera/camera
# (namespace `camera` + name `camera`), and hardcoding that fully-qualified name here
# means a namespace change silently drops every value below with no error.
#
# The three values that were patched into realsense-ros' rs_launch.py in the old
# workspace live here instead (enable_color, align_depth.enable,
# hole_filling_filter.enable), which is why realsense-ros can stay pristine.
#
# *** A PARAMS FILE IS NOT THE SAME AS rs_launch.py, AND THAT CUTS BOTH WAYS ***
# rs_launch.py can only set the 79 names in its hardcoded `configurable_parameters`
# whitelist and prints a yellow "Parameter 'X' is not supported" for anything else. A
# params file can set anything the node DECLARES -- which is far more, and is why this
# file can reach the filters and per-stream QoS that rs_launch.py cannot. The cost is
# that there is no whitelist to catch a typo: an undeclared key here is silently
# ignored. That is exactly how `depth_module.profile` sat here doing nothing. If a
# value in this file appears to have no effect, check the name against the driver
# before assuming the camera is at fault:
#     ros2 param get /camera/camera <the.parameter.name>
# "Parameter not set" means the name is wrong, not that the value failed to apply.
#
# Note also that rs_launch.py's own `config_file:=` argument expects a FLAT dict keyed
# by those whitelisted names -- it cannot read this file's `/**: ros__parameters:`
# structure. The two YAML formats look alike and are not interchangeable.
#
# *** TUNED FOR THE RASPBERRY PI 5: DEPTH-ONLY AT 424x240x15 ***
# The D456 computes stereo depth in its own D4 ASIC, so the host never runs stereo
# matching -- what the Pi pays for is transport plus whatever host-side work the driver
# is told to do. Almost all of that is optional, so it is switched off here: no colour,
# no IR, no pointcloud, no post-processing filters, no depth-to-colour alignment. What
# remains is the depth image and the merged IMU.

/**:
  ros__parameters:
    accel_fps: 100
    accel_info_qos: DEFAULT
    accel_qos: SENSOR_DATA
    # *** OFF, AND IT HAS TO BE. ***
    # align_depth reprojects every depth pixel into the COLOUR frame, and enable_color
    # is false below -- there is nothing to align to. It is also the single largest
    # host-side CPU cost in this driver, which matters on the Pi 5.
    #
    # This used to say "aligned depth is what the depth->laserscan obstacle layer will
    # consume". That is no longer the plan: terrain and clearance analysis is geometric
    # and consumes the unaligned /camera/camera/depth/image_rect_raw in
    # camera_depth_optical_frame directly. Colour registration buys nothing there.
    # Turning this back on requires turning enable_color back on too.
    align_depth:
      enable: false
      frames_queue_size: 16
    angular_velocity_cov: 0.01
    base_frame_id: "link"
    odom_frame_id: "odom"
    camera_name: "camera"
    clip_distance: -1.0
    color_info_qos: DEFAULT
    color_qos: SYSTEM_DEFAULT
    colorizer:
      color_scheme: 0
      enable: false
      frames_queue_size: 16
      histogram_equalization_enabled: true
      max_distance: 6.0
      min_distance: 0.0
      stream_filter: 1
      stream_format_filter: 1
      stream_index_filter: -1
      visual_preset: 0
    decimation_filter:
      enable: false
      filter_magnitude: 2
      frames_queue_size: 16
      stream_filter: 1
      stream_format_filter: 1
      stream_index_filter: -1
    depth_info_qos: DEFAULT
    depth_module:
      # ROI is in PIXELS and must fit inside depth_profile below. These were 479/639,
      # i.e. a 640x480 frame, which is out of range at 424x240. Keep them in step with
      # the profile whenever it changes.
      auto_exposure_roi:
        bottom: 239
        left: 0
        right: 423
        top: 0
      emitter_always_on: false
      emitter_enabled: 1
      emitter_on_off: false
      enable_auto_exposure: true
      error_polling_enabled: true
      exposure: 8500
      frames_queue_size: 16
      gain: 16
      global_time_enabled: true
      hdr_enabled: false
      inter_cam_sync_mode: 0
      laser_power: 150.0
      output_trigger_enabled: false
      # *** THE KEY IS depth_profile, NOT profile. ***
      # This was `profile: 848x480x15`, which is the pre-4.55 spelling and is NOT a
      # parameter this driver declares. realsense2_camera builds the name as
      # <module>.<stream>_profile (src/profile_manager.cpp:446), so 4.57.7 wants
      # depth_module.depth_profile. Because these values arrive in a params file rather
      # than through rs_launch.py, the undeclared key was silently ignored -- no
      # warning -- and the camera quietly ran the driver's 30 fps default instead.
      # Symptom if it regresses: `ros2 param get /camera/camera
      # depth_module.depth_profile` says "Parameter not set".
      #
      # 424x240 is the D4xx minimum standard resolution: ~102k px/frame, ~3 MB/s at
      # 15 fps, against ~24 MB/s for the 848x480x30 default. Terrain and clearance work
      # is geometric and does not need the pixels; at Nav2's vx_max of 0.5 m/s, 15 fps
      # is 3.3 cm of travel between frames. Raise it only if the Pi shows headroom, and
      # update auto_exposure_roi above to match.
      depth_profile: 424x240x15
      sequence_id: 0
      sequence_name: 0
      sequence_size: 2
      visual_preset: 0
    # Best effort, not reliable. Depth frames are large and a dropped one is worth less
    # than the retransmit it would cost over DDS on a Pi. Subscribers must be best
    # effort too, or they will not connect at all.
    depth_qos: SENSOR_DATA
    device_type: ''
    diagnostics_period: 0.0
    disparity_filter:
      enable: false
    disparity_to_depth:
      enable: false
    # *** DEPTH-ONLY, PLUS THE IMU. ***
    # Nothing on CIRCE consumes colour: terrain quality and clearance are computed from
    # depth geometry, and the Nav2 costmaps take /scan. Disabling the colour stream
    # removes it from USB and from the driver entirely, and is what allows align_depth
    # to be off. Re-enabling it means revisiting align_depth and rgb_camera.color_profile.
    #
    # enable_accel + enable_gyro + unite_imu_method: 2 (near the bottom of this file)
    # are LOAD-BEARING: they are what produce the merged /camera/camera/imu that the EKF
    # fuses as imu0. See circe_nav/config/localization_ekf.yaml. Do not "simplify" them
    # away while trimming streams -- with unite_imu_method 0 you get two unsynchronised
    # topics instead and the EKF can use neither.
    enable_accel: true
    enable_color: false
    enable_depth: true
    enable_gyro: true
    # Raw IR streams are not used for navigation -- off to save USB bandwidth.
    # Turn them back on if you need them for stereo debugging.
    enable_infra1: false
    enable_infra2: false
    enable_sync: false
    filter_by_sequence_id:
      enable: false
      frames_queue_size: 16
      sequence_id: 1
    gyro_fps: 200
    gyro_info_qos: DEFAULT
    gyro_qos: SENSOR_DATA
    hdr_merge:
      enable: false
      frames_queue_size: 16
    hold_back_imu_for_frames: false
    # NOTE -- the two CIRCE customizations in the old workspace disagreed here.
    # accessories.yaml said false; the rs_launch.py patch said true. Only
    # accessories.yaml was on the code path actually used (accessories.launch.py ran
    # the node directly and never sourced rs_launch.py), so false is what the robot
    # really did, and false is preserved here.
    # Enabling it is a reasonable thing to want once depth feeds an obstacle layer:
    # it fills small holes in the depth image, at the cost of inventing geometry that
    # the sensor did not measure. Decide it on purpose, with the costmap in view.
    hole_filling_filter:
      enable: false
      frames_queue_size: 16
      holes_fill: 1
      stream_filter: 1
      stream_format_filter: 1
      stream_index_filter: -1
    infra1_info_qos: DEFAULT
    infra1_qos: SYSTEM_DEFAULT
    infra2_info_qos: DEFAULT
    infra2_qos: SYSTEM_DEFAULT
    # Reset the device on startup -- avoids the common "no frames arrived" failure
    # when the node is restarted without replugging the camera. Costs ~2s at boot.
    initial_reset: true
    json_file_path: ''
    linear_accel_cov: 0.01
    motion_module:
      enable_motion_correction: true
      frames_queue_size: 16
      global_time_enabled: true
    pointcloud:
      allow_no_texture_points: false
      enable: false
      filter_magnitude: 2
      frames_queue_size: 16
      ordered_pc: false
      pointcloud_qos: DEFAULT
      stream_filter: 0
      stream_format_filter: 0
      stream_index_filter: -1
    publish_odom_tf: false
    publish_tf: true
    qos_overrides:
      /parameter_events:
        publisher:
          depth: 1000
          durability: volatile
          history: keep_last
          reliability: reliable
      /tf_static:
        publisher:
          depth: 1
          history: keep_last
          reliability: reliable
    reconnect_timeout: 6.0
    rgb_camera:
      auto_exposure_priority: false
      auto_exposure_roi:
        bottom: 479
        left: 0
        right: 639
        top: 0
      backlight_compensation: false
      brightness: 0
      contrast: 50
      enable_auto_exposure: true
      enable_auto_white_balance: true
      exposure: 166
      frames_queue_size: 16
      gain: 64
      gamma: 300
      global_time_enabled: true
      hue: 0
      power_line_frequency: 3
      # Same renaming trap as depth_module above: the driver wants color_profile, not
      # profile. Inert while enable_color is false, but fixed and set low so that
      # switching colour back on does not silently restore the 30 fps default.
      color_profile: 424x240x15
      saturation: 64
      sharpness: 50
      white_balance: 4600.0
    rosbag_filename: ''
    serial_no: ''
    spatial_filter:
      enable: false
      filter_magnitude: 2
      filter_smooth_alpha: 0.5
      filter_smooth_delta: 20
      frames_queue_size: 16
      holes_fill: 0
      stream_filter: 1
      stream_format_filter: 1
      stream_index_filter: -1
    temporal_filter:
      enable: false
      filter_smooth_alpha: 0.4000000059604645
      filter_smooth_delta: 20
      frames_queue_size: 16
      holes_fill: 3
      stream_filter: 1
      stream_format_filter: 1
      stream_index_filter: -1
    tf_publish_rate: 0.0
    unite_imu_method: 2
    usb_port_id: ''
    use_sim_time: false
    wait_for_device_timeout: -1.0
