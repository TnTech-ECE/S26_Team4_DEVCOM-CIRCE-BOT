# Intel RealSense D456 (realsense2_camera). Tuned for the Pi 5: depth (424x240x15) + IMU only.
# Undeclared keys are silently ignored; check with `ros2 param get /camera/camera <name>`.

/**:
  ros__parameters:
    accel_fps: 100
    accel_info_qos: DEFAULT
    accel_qos: SENSOR_DATA
    # Off: no colour stream to align to, and it's CPU-heavy.
    align_depth:
      enable: false
      frames_queue_size: 16
    angular_velocity_cov: 0.01
    base_frame_id: "link"
    odom_frame_id: "odom"
    camera_name: "camera"
    clip_distance: -1.0
    color_info_qos: DEFAULT
    color_qos: SYSTEM_DEFAULT
    colorizer:
      color_scheme: 0
      enable: false
      frames_queue_size: 16
      histogram_equalization_enabled: true
      max_distance: 6.0
      min_distance: 0.0
      stream_filter: 1
      stream_format_filter: 1
      stream_index_filter: -1
      visual_preset: 0
    decimation_filter:
      enable: false
      filter_magnitude: 2
      frames_queue_size: 16
      stream_filter: 1
      stream_format_filter: 1
      stream_index_filter: -1
    depth_info_qos: DEFAULT
    depth_module:
      # ROI in pixels; keep inside depth_profile.
      auto_exposure_roi:
        bottom: 239
        left: 0
        right: 423
        top: 0
      emitter_always_on: false
      emitter_enabled: 1
      emitter_on_off: false
      enable_auto_exposure: true
      error_polling_enabled: true
      exposure: 8500
      frames_queue_size: 16
      gain: 16
      global_time_enabled: true
      hdr_enabled: false
      inter_cam_sync_mode: 0
      laser_power: 150.0
      output_trigger_enabled: false
      # Key is depth_profile (not profile).
      depth_profile: 424x240x15
      sequence_id: 0
      sequence_name: 0
      sequence_size: 2
      visual_preset: 0
    # Best effort; subscribers must match.
    depth_qos: SENSOR_DATA
    device_type: ''
    diagnostics_period: 0.0
    disparity_filter:
      enable: false
    disparity_to_depth:
      enable: false
    # Depth + IMU only. accel/gyro + unite_imu_method: 2 produce /camera/camera/imu.
    enable_accel: true
    enable_color: false
    enable_depth: true
    enable_gyro: true
    enable_infra1: false
    enable_infra2: false
    enable_sync: false
    filter_by_sequence_id:
      enable: false
      frames_queue_size: 16
      sequence_id: 1
    gyro_fps: 200
    gyro_info_qos: DEFAULT
    gyro_qos: SENSOR_DATA
    hdr_merge:
      enable: false
      frames_queue_size: 16
    hold_back_imu_for_frames: false
    hole_filling_filter:
      enable: false
      frames_queue_size: 16
      holes_fill: 1
      stream_filter: 1
      stream_format_filter: 1
      stream_index_filter: -1
    infra1_info_qos: DEFAULT
    infra1_qos: SYSTEM_DEFAULT
    infra2_info_qos: DEFAULT
    infra2_qos: SYSTEM_DEFAULT
    # Reset on startup to avoid "no frames arrived" after a restart.
    initial_reset: true
    json_file_path: ''
    linear_accel_cov: 0.01
    motion_module:
      enable_motion_correction: true
      frames_queue_size: 16
      global_time_enabled: true
    pointcloud:
      allow_no_texture_points: false
      enable: false
      filter_magnitude: 2
      frames_queue_size: 16
      ordered_pc: false
      pointcloud_qos: DEFAULT
      stream_filter: 0
      stream_format_filter: 0
      stream_index_filter: -1
    publish_odom_tf: false
    publish_tf: true
    qos_overrides:
      /parameter_events:
        publisher:
          depth: 1000
          durability: volatile
          history: keep_last
          reliability: reliable
      /tf_static:
        publisher:
          depth: 1
          history: keep_last
          reliability: reliable
    reconnect_timeout: 6.0
    rgb_camera:
      auto_exposure_priority: false
      auto_exposure_roi:
        bottom: 479
        left: 0
        right: 639
        top: 0
      backlight_compensation: false
      brightness: 0
      contrast: 50
      enable_auto_exposure: true
      enable_auto_white_balance: true
      exposure: 166
      frames_queue_size: 16
      gain: 64
      gamma: 300
      global_time_enabled: true
      hue: 0
      power_line_frequency: 3
      # Inert while enable_color is false.
      color_profile: 424x240x15
      saturation: 64
      sharpness: 50
      white_balance: 4600.0
    rosbag_filename: ''
    serial_no: ''
    spatial_filter:
      enable: false
      filter_magnitude: 2
      filter_smooth_alpha: 0.5
      filter_smooth_delta: 20
      frames_queue_size: 16
      holes_fill: 0
      stream_filter: 1
      stream_format_filter: 1
      stream_index_filter: -1
    temporal_filter:
      enable: false
      filter_smooth_alpha: 0.4000000059604645
      filter_smooth_delta: 20
      frames_queue_size: 16
      holes_fill: 3
      stream_filter: 1
      stream_format_filter: 1
      stream_index_filter: -1
    tf_publish_rate: 0.0
    unite_imu_method: 2
    usb_port_id: ''
    use_sim_time: false
    wait_for_device_timeout: -1.0
