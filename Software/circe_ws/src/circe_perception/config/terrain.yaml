# Terrain traversability (terrain_node) and lidar ground filter (scan_pitch_filter).

/**:
  ros__parameters:

    # ---- terrain_node.py ----
    # odom, not map, so the grid doesn't jump on SLAM corrections.
    global_frame: odom
    robot_frame: base_link

    # Ground first visible at ~0.62 m. Past 4 m depth noise ~ step_lethal.
    roi_min_range: 0.6
    roi_max_range: 4.0
    roi_half_width: 2.0

    # D456 minimum depth.
    depth_min: 0.4
    depth_max: 4.5

    pixel_stride: 4

    # Must match the costmap resolution in nav2_params.yaml.
    resolution: 0.05
    grid_size_m: 12.0

    # Per frame; ~2.3 s half-life at 15 Hz.
    decay: 0.98
    # Below this a cell is UNKNOWN (-1), never lethal.
    min_points_per_cell: 3.0
    # Low-confidence cells get scaled-down cost.
    full_confidence_points: 12.0
    min_points_for_lethal: 6.0

    # Thresholds are derived from the URDF/specs, not measured on hardware.
    # Step: height above local ground (~0.5 x wheel radius).
    step_warn: 0.03
    step_lethal: 0.06

    # Radians (10 / 25 deg).
    slope_warn: 0.17
    slope_lethal: 0.44

    # Height std-dev in a cell; graded cost only, never lethal.
    rough_warn: 0.010
    rough_max: 0.040
    rough_max_cost: 60

    # Depth below local ground; the lidar can't see holes.
    drop_warn: 0.04
    drop_lethal: 0.08

    # Step and slope use different windows, or ramps read as steps.
    step_window: 3
    slope_window: 5
    # Skip the slope test where the window is mostly empty.
    min_slope_support: 0.25

    publish_rate: 5.0
    # 100 = OccupancyGrid occupied -> lethal in StaticLayer.
    lethal_cost: 100
    publish_debug_cloud: false

    # ---- scan_pitch_filter.py (same file; each node declares only its keys) ----
    # Removes ground returns when the body tilts; the EKF's TF stays level (two_d_mode).
    scan_in: /scan
    scan_out: /scan_filtered
    imu_topic: /imu/data

    # lidar_mount_z; change if the lidar is remounted.
    lidar_height: 0.295

    # Fraction of the geometric ground-strike range to cut at.
    range_margin: 0.85

    min_tilt_deg: 3.0

    # Safety floor; raise it, never lower it.
    min_keep_range: 0.35

    # On timeout, pass the raw scan through (fail open).
    imu_timeout: 0.5

    # ---- terrain_node attitude ----
    # Use IMU roll/pitch, since TF reports level (two_d_mode).
    use_imu_attitude: true

    # Cells the robot has driven over are always free. Keep on.
    clear_driven: true

    # Just over the footprint's circumscribed radius (0.326 m).
    driven_radius: 0.4
